[project]
name = "hashring"
version = "0.1.0"
description = "Consistent hashing distributed cache with a live visual dashboard"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
bench = [
    "matplotlib>=3.8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["hashring", "node", "gateway"]

[tool.pytest.ini_options]
testpaths = ["tests"]
